<!DOCTYPE html><html lang="ko"><head><meta charset="utf-8"><title>overpass probe</title>
<style>body{background:#111;color:#eee;font:13px/1.5 monospace;padding:16px}pre{white-space:pre-wrap}</style></head>
<body><h3>Overpass / Photon CORS probe</h3><pre id="out">running…</pre>
<script>
const Q = '[out:json][timeout:20];nwr["amenity"~"^(restaurant|cafe|bar|fast_food)$"]["name"](around:1200,37.5540,126.9615);out center 60;';
const log = s => { document.getElementById('out').textContent += '\n' + s; };
async function tryGet(name, url) {
  const t0 = Date.now();
  try {
    const r = await fetch(url, { cache: 'no-store' });
    const txt = await r.text();
    let n = 0, sample = '';
    try { const j = JSON.parse(txt); n = (j.elements || []).length; sample = (j.elements && j.elements[0] && j.elements[0].tags.name) || ''; } catch (e) {}
    log(`${name} GET -> ${r.status} ${txt.length}B ${Date.now() - t0}ms els=${n} ${sample}`);
  } catch (e) { log(`${name} GET -> ERR ${String(e)} ${Date.now() - t0}ms`); }
}
async function tryPost(name, url) {
  const t0 = Date.now();
  try {
    const r = await fetch(url, { method: 'POST', body: 'data=' + encodeURIComponent(Q),
      headers: { 'Content-Type': 'application/x-www-form-urlencoded' }, cache: 'no-store' });
    const txt = await r.text();
    let n = 0, sample = '';
    try { const j = JSON.parse(txt); n = (j.elements || []).length; sample = (j.elements && j.elements[0] && j.elements[0].tags.name) || ''; } catch (e) {}
    log(`${name} POST -> ${r.status} ${txt.length}B ${Date.now() - t0}ms els=${n} ${sample}`);
  } catch (e) { log(`${name} POST -> ERR ${String(e)} ${Date.now() - t0}ms`); }
}
async function photon(label, url) {
  const t0 = Date.now();
  try {
    const r = await fetch(url, { cache: 'no-store' });
    const j = await r.json();
    log(`${label} -> ${r.status} ${Date.now() - t0}ms n=${(j.features || []).length} ` + (j.features || []).slice(0, 4).map(f => f.properties.name + '/' + f.properties.street).join(', '));
  } catch (e) { log(`${label} -> ERR ${String(e)}`); }
}
(async () => {
  const G = 'https://maps.mail.ru/osm/tools/overpass/api/interpreter';
  await Promise.all([
    tryGet('mail.ru', G + '?data=' + encodeURIComponent(Q)),
    tryPost('mail.ru', G),
  ]);
  await Promise.all([
    tryPost('overpass-api.de', 'https://overpass-api.de/api/interpreter'),
    tryGet('osm.ch', 'https://overpass.osm.ch/api/interpreter?data=' + encodeURIComponent(Q)),
    tryGet('kumi', 'https://overpass.kumi.systems/api/interpreter?data=' + encodeURIComponent(Q)),
  ]);
  const bb = '126.9315,37.5295,126.9915,37.5795';
  await Promise.all([
    photon('photon q=맛집', `https://photon.komoot.io/api/?q=${encodeURIComponent('맛집')}&limit=20&bbox=${bb}&osm_tag=amenity:restaurant`),
    photon('photon q=국밥', `https://photon.komoot.io/api/?q=${encodeURIComponent('국밥')}&limit=20&bbox=${bb}&osm_tag=amenity:restaurant`),
    photon('photon q=식당', `https://photon.komoot.io/api/?q=${encodeURIComponent('식당')}&limit=20&bbox=${bb}&osm_tag=amenity:restaurant`),
    photon('photon q=마포구', `https://photon.komoot.io/api/?q=${encodeURIComponent('마포구')}&limit=20&bbox=${bb}&layer=venue`),
  ]);
  log('done');
})();
</script></body></html>

name: 김당근 미식 · 매일 데이터 갱신

on:
  schedule:
    - cron: '0 21 * * *'   # 매일 21:00 UTC = 06:00 KST
  workflow_dispatch:
    inputs:
      menu_limit:
        description: '이번 실행에서 대표메뉴를 확인할 최대 곳'
        required: false
        default: '1200'
      new_limit:
        description: '이번 실행에서 새로 추가할 최대 곳'
        required: false
        default: '250'

permissions:
  contents: write

concurrency:
  group: daily-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 170
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 데이터 갱신 (신규 발굴 · 대표메뉴 · 확인일 정리 · 재빌드)
        env:
          MENU_LIMIT: ${{ github.event.inputs.menu_limit || '1200' }}
          NEW_LIMIT: ${{ github.event.inputs.new_limit || '250' }}
        run: python3 scripts/daily_update.py

      - name: 문법·개인정보 검사
        run: python3 scripts/check.py

      - name: 결과 요약
        if: always()
        run: |
          python3 - <<'PY'
          import json, os
          p = 'data/last-run.json'
          if os.path.exists(p):
              d = json.load(open(p, encoding='utf-8'))
              lines = [
                  '### 🥕 김당근 미식 데이터 갱신',
                  f"- 전체: **{d['total']:,}곳**",
                  f"- 대표메뉴 있음: **{d['with_menu']:,}곳** (가격대 표기 {d['price_level']:,}곳)",
                  f"- 확인일 1년 경과 정리: {d['dropped_stale']}곳",
                  f"- 신규: {d['new_log']}",
                  f"- 메뉴: {d['menu_log']}",
              ]
              text = '\n'.join(lines)
              print(text)
              with open(os.environ['GITHUB_STEP_SUMMARY'], 'a', encoding='utf-8') as f:
                  f.write(text + '\n')
          else:
              print('last-run.json 없음')
          PY

      - name: 변경 커밋·푸시
        run: |
          git config user.name "kimdanggeun-bot"
          git config user.email "kimdanggeun-bot@users.noreply.github.com"
          git add data index.html
          if git diff --cached --quiet; then
            echo "변경 없음"
          else
            git commit -m "매일 자동 갱신: $(date -u +'%Y-%m-%d') 데이터·대표메뉴"
            git push
          fi
